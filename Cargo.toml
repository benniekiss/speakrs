[package]
name = "speakrs"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Fast Rust speaker diarization with pyannote-level accuracy and ONNX Runtime acceleration"
documentation = "https://docs.rs/speakrs"
readme = "README.md"
repository = "https://github.com/avencera/speakrs"
license = "Apache-2.0"
keywords = ["audio", "diarization", "onnx", "pyannote", "speaker"]
categories = ["multimedia::audio", "science"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/examples/**", "/src/**"]

[package.metadata.docs.rs]
features = ["cuda", "migraphx", "load-dynamic", "_metrics"]

[workspace]
members = ["xtask"]
exclude = ["scripts/"]

[dependencies]
hf-hub = { version = "0.5", default-features = false, optional = true }

# math
kodama = "0.3.0"
ndarray = "0.17.2"
ndarray-linalg-mkl = { package = "ndarray-linalg", version = "0.18.1", features = ["intel-mkl-static"], optional = true }
ndarray-linalg-static = { package = "ndarray-linalg", version = "0.18.1", features = ["openblas-static"], optional = true }
ndarray-linalg-system = { package = "ndarray-linalg", version = "0.18.1", features = ["openblas-system"], optional = true }
ndarray-npy = "0.10.0"

libloading = { version = "0.9.0", optional = true }
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }

# logging
tracing = "0.1.44"

# error handling
thiserror = "2.0.18"

# concurrency
crossbeam-channel = "0.5"
rayon = "1.11.0"

[dev-dependencies]
approx = "0.5.1"
serde_json = "1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[target.'cfg(all(not(target_os = "macos"), not(target_arch = "x86_64")))'.dependencies]
ndarray-linalg-default = { package = "ndarray-linalg", version = "0.18.1", features = ["openblas-static"], optional = true }

[target.'cfg(all(not(target_os = "macos"), target_arch = "x86_64"))'.dependencies]
ndarray-linalg-default = { package = "ndarray-linalg", version = "0.18.1", features = ["intel-mkl-static"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accelerate-src = { version = "0.3.2", optional = true }
ndarray-linalg-default = { package = "ndarray-linalg", version = "0.18.1", optional = true }

[features]
default = ["default-linalg", "online"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
default-linalg = ["dep:accelerate-src", "dep:ndarray-linalg-default"]
load-dynamic = ["dep:libloading", "ort/load-dynamic"]
migraphx = ["ort/migraphx"]
online = ["dep:hf-hub", "hf-hub/native-tls", "hf-hub/ureq"]
webgpu = ["ort/webgpu"]

intel-mkl = ["dep:ndarray-linalg-mkl"]
openblas-static = ["dep:ndarray-linalg-static"]
openblas-system = ["dep:ndarray-linalg-system"]

_metrics = []
