[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "speakrs-bm"
path = "src/bin/speakrs_bm.rs"
required-features = ["cuda"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
hound = "3.5.1"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
speakrs = { path = "..", default-features = false, features = ["default-linalg", "_metrics"] }
tempfile = "3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wait-timeout = "0.2"

[features]
_metrics = ["speakrs/_metrics"]
coreml = ["speakrs/coreml"]
cuda = ["speakrs/cuda"]
default-linalg = ["speakrs/default-linalg"]
load-dynamic = ["ort/load-dynamic", "speakrs/load-dynamic"]
webgpu = ["speakrs/webgpu"]
